[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
ctrlc = "3.4.7"
libc = "0.2.175"
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1", features = ["full"] }

[target.'cfg(any(target_os = "windows"))'.dependencies]
dokan = "0.3.1"
dokan-sys = "0.3.1"
widestring = "0.4.3"

[target.'cfg(any(target_os = "linux"))'.dependencies]
fuser = "0.15.1"