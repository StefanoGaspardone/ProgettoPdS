[package]
name = "client"
version = "0.1.0"


[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
lazy_static = "1.4"
bindgen = "0.72.0"

# Dipendenze solo per Unix (Linux, macOS)
[target.'cfg(unix)'.dependencies]
fuser = "0.14"
libc = "0.2"

# Dipendenze solo per Windows
[target.'cfg(windows)'.dependencies]
winfsp = "0.11.3"


