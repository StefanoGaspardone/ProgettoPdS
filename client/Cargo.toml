[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
libc = "0.2.175"
reqwest = "0.12.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1", features = ["full"] }

[target.'cfg(any(target_os = "windows"))'.dependencies]
winfsp = "0.11.3"
[target.'cfg(any(target_os = "linux"))'.dependencies]
fuser = "0.15.1"
